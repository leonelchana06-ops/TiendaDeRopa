# =====================================================================
#  Tienda de Ropa - Configuración de la aplicación
#  Las tablas NO se crean con código SQL: las genera Hibernate al iniciar.
#  La base de datos "bd_tienda_ropa" se crea sola (createDatabaseIfNotExist);
#  si prefiere crearla a mano en MySQL, quite ese parámetro de la URL.
# =====================================================================
spring.application.name=TiendaDeRopa
server.port=8080

# ---- Base de datos MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/bd_tienda_ropa?createDatabaseIfNotExist=true
spring.datasource.username=Leonel
spring.datasource.password=1234

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate crea las tablas la primera vez y las actualiza si cambian las entidades
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carga productos, clientes y empleados de ejemplo si las tablas están vacías
datos.ejemplo=true

# Permite serializar las relaciones (por ejemplo los renglones de una venta)
spring.jpa.open-in-view=true
